[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "credish"
version = "0.1.0"
description = "Redis-compatible in-process cache as a Python C extension"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["redis", "cache", "in-process", "key-value", "data-structures"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Ravisxcr/credish"
Repository = "https://github.com/Ravisxcr/credish"
Documentation = "https://github.com/Ravisxcr/credish/tree/main/docs"
Issues = "https://github.com/Ravisxcr/credish/issues"

[project.optional-dependencies]
dev = ["cibuildwheel", "pytest", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["."]
include = ["credish*"]

[tool.setuptools.package-data]
credish = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
addopts = "-s"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-musllinux*"
test-requires = ["pytest", "pytest-timeout"]
test-command = "pytest \"{project}/tests/unit\""

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

