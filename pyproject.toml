[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credish"
version = "0.0.1"
description = "Redis-compatible in-process cache as a Python C extension"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["cibuildwheel", "pytest", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["."]
include = ["credish*"]

[tool.pytest.ini_options]
addopts = "-s"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-musllinux*"
test-requires = ["pytest", "pytest-timeout"]
test-command = "pytest {project}/tests/unit"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
